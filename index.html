<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ledger</title>
<style>
  :root{
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --text: #1C1C1E;
    --text-secondary: #8E8E93;
    --border: #E5E5EA;
    --accent: #007AFF;
    --accent-soft: #E9F2FF;
    --excellent: #34C759;
    --good: #8DC63F;
    --moderate: #FFCC00;
    --limit: #FF9500;
    --minimize: #FF3B30;
    --unknown: #C7C7CC;
    --danger: #FF3B30;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  }
  .wrap{ max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header.topbar{
    padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
    background: var(--bg);
    position: sticky; top:0; z-index: 5;
  }
  header.topbar h1{ font-size: 28px; font-weight: 700; margin:0; letter-spacing: -0.02em; }
  header.topbar .sub{ color: var(--text-secondary); font-size: 14px; margin-top: 2px; }
  .signout-row{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .signout-row span{ font-size:12.5px; color: var(--text-secondary); }

  .card{
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    margin-bottom: 14px;
  }
  .card + .card{ margin-top: 0; }

  label.field-label{
    display:block; font-size: 13px; font-weight: 600; color: var(--text-secondary);
    margin-bottom: 6px;
  }
  input[type=text], input[type=number], input[type=date], input[type=datetime-local], textarea{
    width:100%;
    font-family: inherit; font-size: 16px; color: var(--text);
    background: #F7F7F9;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 12px;
  }
  textarea{ min-height: 70px; resize: vertical; }
  .suggestion-row{
    display:block; width:100%; text-align:left; font-family:inherit; font-size:14.5px;
    background:#fff; border:none; border-bottom:1px solid var(--border);
    padding:10px 12px; cursor:pointer;
  }
  .suggestion-row:last-child{ border-bottom:none; }
  .suggestion-row:active{ background:var(--accent-soft); }
  input:focus, textarea:focus{ outline: none; border-color: var(--accent); background: #fff; }

  .btn{
    font-family: inherit; font-size: 16px; font-weight: 600;
    border: none; border-radius: 12px; padding: 13px 16px;
    cursor: pointer;
  }
  .btn-primary{ background: var(--accent); color: #fff; width:100%; }
  .btn-primary:active{ opacity: 0.85; }
  .btn-secondary{ background: var(--accent-soft); color: var(--accent); }
  .btn-text{ background: none; color: var(--accent); font-size: 14px; font-weight: 600; padding: 6px 4px; }
  .btn-text.danger{ color: var(--danger); }
  .btn-row{ display:flex; gap:10px; margin-top: 12px; flex-wrap: wrap; }
  .btn-row .btn{ flex:1; }

  /* Segmented control */
  .segmented{
    display:flex; background:#E5E5EA; border-radius: 10px; padding: 2px; gap:2px;
  }
  .segmented button{
    flex:1; border:none; background:transparent; border-radius: 8px;
    padding: 8px 4px; font-size: 13px; font-weight: 600; color: var(--text);
    cursor:pointer; font-family: inherit;
  }
  .segmented button.active{ background:#fff; box-shadow: 0 1px 2px rgba(0,0,0,0.15); }

  /* Score badge */
  .badge{
    width: 40px; height:40px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-weight: 700; font-size: 15px; color:#fff; flex:none;
  }
  .badge-lg{ width: 56px; height:56px; font-size: 20px; }

  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background: #F7F7F9; border-radius: 20px; padding: 5px 10px 5px 5px;
    font-size: 13px; margin: 3px 6px 3px 0;
  }
  .chip .dot{ width:18px; height:18px; border-radius:50%; color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }

  .row-list li{
    display:flex; align-items:flex-start; gap:12px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .row-list li:last-child{ border-bottom:none; padding-bottom: 24px; }
  .meal-tag{
    font-size: 11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    color: var(--accent); background: var(--accent-soft);
    padding: 3px 8px; border-radius: 6px; display:inline-block; margin-bottom: 3px;
  }
  .entry-name{ font-size: 16px; font-weight: 600; text-transform:capitalize; }
  .entry-meta{ font-size: 12.5px; color: var(--text-secondary); margin-top:1px; }
  .entry-actions{ margin-top:8px; display:flex; gap:14px; flex-wrap:wrap; }
  .entry-actions button{ font-family:inherit; background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:600; padding:0; cursor:pointer; }
  .entry-actions button.danger{ color: var(--danger); }

  .empty{ color: var(--text-secondary); font-size: 14.5px; text-align:center; padding: 30px 0; }
  .hint{ color: var(--text-secondary); font-size: 13.5px; }
  .note-text{ font-size: 13.5px; color: var(--text); margin-top: 6px; }

  .stats-row{ display:flex; gap:10px; margin-bottom: 14px; }
  .stat{ flex:1; background: var(--card); border-radius: 14px; padding: 12px; text-align:center; }
  .stat .n{ font-size: 22px; font-weight: 700; }
  .stat .l{ font-size: 11px; color: var(--text-secondary); margin-top:2px; }

  .field-chip{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 16px; padding: 6px 10px; font-size: 13px; font-weight:600;
    margin: 3px 6px 3px 0;
  }
  .field-chip button{ background:none; border:none; color: var(--accent); cursor:pointer; font-size:14px; line-height:1; padding:0; }
  .type-chip{
    font-family: inherit; font-size: 14px; font-weight: 600;
    border: 2px solid var(--border); background: #fff; color: var(--text);
    border-radius: 18px; padding: 8px 14px; cursor: pointer;
  }
  .type-chip.selected{ border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  /* Tab bar */
  nav.tabbar{
    position: fixed; bottom:0; left:0; width:100%;
    background: #FFFFFF;
    border-top: 1px solid var(--border);
    display:flex;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    z-index: 999;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; padding: 8px 4px 6px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color: var(--text-secondary); font-family: inherit; font-size: 10.5px; font-weight:600;
    cursor:pointer;
  }
  nav.tabbar button.active{ color: var(--accent); }
  nav.tabbar svg{ width:24px; height:24px; }

  .panel{ display:none; padding-bottom: 20px; }
  .panel.active{ display:block; }

  /* Auth screen */
  .auth-wrap{ max-width: 360px; margin: 18vh auto 0; padding: 0 20px; }
  .auth-wrap h1{ font-size: 26px; font-weight:700; text-align:center; margin-bottom:4px; }
  .auth-wrap .sub{ text-align:center; color: var(--text-secondary); font-size: 14px; margin-bottom: 26px; }
  .auth-wrap input{ margin-bottom: 10px; }
  .auth-error{ color: var(--danger); font-size: 13px; margin-top: 8px; text-align:center; }
  .auth-switch{ text-align:center; margin-top: 16px; font-size: 13.5px; color: var(--text-secondary); }

  @media print{
    nav.tabbar, header.topbar .signout-row, .btn-row{ display:none !important; }
  }
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap">
  <h1>Ledger</h1>
  <p class="sub">Food and body tracking, built for you</p>
  <input type="text" id="authEmail" placeholder="Email" autocomplete="username">
  <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
  <button class="btn btn-primary" id="signInBtn">Sign In</button>
  <p class="auth-error" id="authError"></p>
  <p class="auth-switch">No account yet? <button class="btn-text" id="createAcctBtn">Create one</button></p>
</div>

<div id="appShell" style="display:none;">

    </div>

  <div class="wrap">

    <!-- LOG PANEL -->
    <div id="panelLog" class="panel active">
      <div class="card">
        <label class="field-label">Meal</label>

          <button data-meal="Lunch">Lunch</button>
          <button data-meal="Snack">Snack</button>
          <button data-meal="Dinner">Dinner</button>
          <button data-meal="Late Night Snack">Late Night</button>
        </div>
        <label class="field-label" style="margin-top:14px;">What did you eat?</label>
        <textarea id="ingredientsInput" placeholder="e.g. eggs, avocado mayo, cucumber, sourdough rye"></textarea>
        <div id="ingredientSuggestions" style="display:none; margin-top:6px; border:1px solid var(--border); border-radius:10px; overflow:hidden;"></div>
        <div class="btn-row">
          <button class="btn btn-primary" id="checkMealBtn">Check it</button>
        </div>
      </div>
      <div id="logResultArea"></div>
    </div>

    <!-- JOURNAL PANEL -->
    <div id="panelJournal" class="panel">
      <div id="journalArea"><p class="empty">Loading…</p></div>
    </div>

    <!-- SUMMARY PANEL -->
    <div id="panelSummary" class="panel">
      <div id="summaryArea"></div>
    </div>

    <!-- BODY PANEL -->
    <div id="panelBody" class="panel">
      <div class="card">
        <label class="field-label">Types (tap one to start a new entry)</label>
        <div id="fieldPicker"></div>
        <div class="btn-row" style="margin-top:10px;">
          <input type="text" id="newFieldInput" placeholder="Add a new type, e.g. Weight" style="flex:2;">
          <button class="btn btn-secondary" id="addFieldBtn" style="flex:1;">Add</button>
        </div>
        <button class="btn-text" id="openBlankFormBtn" style="margin-top:8px; padding:0;">+ New entry (no type)</button>
      </div>

      <div class="card" id="bodyFormCard" style="display:none;">
        <p class="hint" id="editingBanner" style="display:none; color:var(--accent); font-weight:600;">Editing an existing entry</p>
        <label class="field-label">Date</label>
        <input type="date" id="bodyDateInput">
        <label class="field-label" style="margin-top:12px;">Type</label>
        <div id="typeChipPicker" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        <div class="btn-row" style="margin-top:8px;">
          <input type="text" id="newTypeInput" placeholder="Add a new type, e.g. Cardio" style="flex:2;">
          <button class="btn btn-secondary" id="addTypeBtn" style="flex:1;">Add</button>
        </div>
        <label class="field-label" style="margin-top:12px;">Detail</label>
        <input type="text" id="bodyDetailInput" placeholder="e.g. Rowing Machine, Left Foot — optional">
        <label class="field-label" style="margin-top:12px;">Notes</label>
        <input type="text" id="bodyNotesInput" placeholder="Optional">
        <label class="field-label" style="margin-top:12px;">Time</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="number" id="bodyMinInput" min="0" placeholder="Min" style="flex:1;">
          <span class="hint">:</span>
          <input type="number" id="bodySecInput" min="0" max="59" placeholder="Sec" style="flex:1;">
          <span class="hint">optional</span>
        </div>
        <div id="bodyFieldInputs" style="margin-top:12px;"></div>
        <div class="btn-row">
          <button class="btn btn-primary" id="saveBodyBtn">Save entry</button>
          <button class="btn btn-secondary" id="cancelEditBodyBtn">Cancel</button>
        </div>
      </div>

      <div id="bodyEntriesArea"></div>
    </div>

    <div style="height:140px;"></div>
  </div>

  <nav class="tabbar">
    <button id="tabLogBtn" class="active" data-tab="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      Log
    </button>
    <button id="tabJournalBtn" data-tab="journal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
      Journal
    </button>
    <button id="tabSummaryBtn" data-tab="summary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6v4H9z"/><path d="M6 5H5a1 1 0 00-1 1v14a1 1 0 001 1h14a1 1 0 001-1V6a1 1 0 00-1-1h-1"/><path d="M8 12h8M8 16h5"/></svg>
      Summary
    </button>
    <button id="tabBodyBtn" data-tab="body">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 8.6c0 4.4-8.8 10.4-8.8 10.4S3.2 13 3.2 8.6a4.6 4.6 0 018.8-2 4.6 4.6 0 018.8 2z"/></svg>
      Body
    </button>
  </nav>
</div>

const BANDS = [
  {label:"excellent", range:[8.5,10], color:"var(--excellent)", repScore:9.5},
  {label:"good",      range:[6.5,8.49], color:"var(--good)", repScore:7.5},
  {label:"moderate",  range:[4.5,6.49], color:"var(--moderate)", repScore:5.5},
  {label:"limit",     range:[2.5,4.49], color:"var(--limit)", repScore:3.5},
  {label:"minimize",  range:[1,2.49], color:"var(--minimize)", repScore:1.5},
];
function band(score){
  if(score===null||score===undefined) return {label:"unrated", color:"var(--unknown)"};
  for(const b of BANDS){ if(score>=b.range[0]) return b; }
  return BANDS[BANDS.length-1];
}
function lookupAuto(name){
  const t = name.toLowerCase().trim();
  for(const entry of DICTIONARY){ if(t.includes(entry.k)) return entry; }
  return null;
}
function slugify(name){
  return name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
const APP_TIMEZONE = 'America/Los_Angeles';
function fmtDate(iso){
  return new Date(iso).toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric', timeZone: APP_TIMEZONE});
}
function fmtTime(iso){
  return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit', timeZone: APP_TIMEZONE});
}
function todayInputValue(){
  return new Date().toLocaleDateString('en-CA',{timeZone: APP_TIMEZONE});
}
function isoToPacificWallTimeLocal(iso){
  const d = new Date(iso);
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: APP_TIMEZONE, year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', hour12:false
  }).formatToParts(d);
  const get = t => parts.find(p=>p.type===t).value;
  return `${get('year')}-${get('month')}-${get('day')}T${get('hour')}:${get('minute')}`;
}
function pacificWallTimeToISO(dateTimeLocalStr){
  const guessUTC = new Date(dateTimeLocalStr + 'Z');
  const asPacificDate = new Date(guessUTC.toLocaleString('en-US', {timeZone: APP_TIMEZONE}));
  const diff = guessUTC.getTime() - asPacificDate.getTime();
  return new Date(guessUTC.getTime() + diff).toISOString();
}
function dateInputToISO(dateStr){
  return new Date(dateStr + 'T12:00:00').toISOString();
}
function badgeHTML(score, size){
  const b = band(score);
  const cls = size==='lg' ? 'badge badge-lg' : 'badge';
  return `<div class="${cls}" style="background:${b.color}">${score!==null&&score!==undefined?score:'?'}</div>`;
}

/* ---------- Open Food Facts fallback ---------- */
async function lookupOpenFoodFacts(name){
  try{
    const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(name)}&search_simple=1&action=process&json=1&page_size=5`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    if(!data.products || data.products.length === 0) return null;
    const term = name.toLowerCase().trim();
    const hasNutrients = p => {
      const n = p.nutriments || {};
      return n.carbohydrates_100g !== undefined && (n.sugars_100g !== undefined || n.fiber_100g !== undefined);
    };
    const relevant = data.products.find(p => hasNutrients(p) && (p.product_name || '').toLowerCase().includes(term));
    const candidate = relevant || data.products.find(hasNutrients);
    if(!candidate) return null;
    const n = candidate.nutriments || {};
    const sugar = n.sugars_100g ?? 0;
    const fiber = n.fiber_100g ?? 0;
    const carbs = n.carbohydrates_100g ?? 0;
    const protein = n.proteins_100g ?? 0;
    const netCarb = Math.max(carbs - fiber, 0);
    let score = 10;
    if(sugar >= 20) score -= 6; else if(sugar >= 10) score -= 4; else if(sugar >= 5) score -= 2; else if(sugar >= 2) score -= 1;
    if(netCarb >= 50) score -= 3; else if(netCarb >= 30) score -= 2; else if(netCarb >= 15) score -= 1;
    if(fiber >= 6) score += 2; else if(fiber >= 3) score += 1;
    if(protein >= 15) score += 1;
    score = Math.max(1, Math.min(10, Math.round(score * 2) / 2));
    return {
      productName: candidate.product_name || name, brand: candidate.brands || '',
      sugar, fiber, carbs, protein, netCarb, score, relevanceMatched: !!relevant
    };
  }catch(e){ return null; }
}

/* ---------- State & storage ---------- */
let LOGS = [];        // [{id, mealType, timestamp, items:[{name,score}], avgScore, note}]
let FOODCACHE = {};   // slug -> {name, score, category, note}
let BODYFIELDS = [];  // ["Weight", "Left Foot", ...]
let BODYTYPES = [];   // ["Cardio", "Balance", "Scale", ...]
let BODYLOGS = [];    // [{id, date, values:{field: value}}]
let dataLoaded = false;
let lastKnownCount = 0;

async function loadData(){
  if(!currentUid) return;
  try{
    const ref = doc(db, 'users', currentUid, 'foodlog', 'v2');
    const snap = await getDoc(ref);
    if(snap.exists() && snap.data().payload){
      const parsed = JSON.parse(snap.data().payload);
      LOGS = parsed.logs || [];
      FOODCACHE = parsed.foodCache || {};
    } else {
      await migrateLegacyData();
    }
    const bodyRef = doc(db, 'users', currentUid, 'bodylog', 'data');
    const bodySnap = await getDoc(bodyRef);
    if(bodySnap.exists() && bodySnap.data().payload){
      const bp = JSON.parse(bodySnap.data().payload);
      BODYFIELDS = bp.fields || [];
      BODYLOGS = bp.entries || [];
      BODYTYPES = bp.types || [...new Set(BODYLOGS.map(e=>e.type).filter(Boolean))];
    }
  }catch(e){
    LOGS = []; FOODCACHE = {};
  }
  lastKnownCount = LOGS.length;
  dataLoaded = true;
}
async function migrateLegacyData(){
  // Best-effort import from the old per-item catalog format, if it exists.
  try{
    const oldRef = doc(db, 'users', currentUid, 'foodlog', 'data');
    const oldSnap = await getDoc(oldRef);
    if(!oldSnap.exists() || !oldSnap.data().payload) return;
    const old = JSON.parse(oldSnap.data().payload);
    Object.values(old).forEach(e=>{
      const slug = slugify(e.name);
      FOODCACHE[slug] = { name: e.name, score: e.score, category: e.category||'', note: e.note||'' };
      const dates = e.dates || (e.lastLogged ? [e.lastLogged] : [new Date().toISOString()]);
      const items = (e.source === 'meal' && e.ingredients) ? e.ingredients : [{name: e.name, score: e.score}];
      dates.forEach(d=>{
        LOGS.push({
          id: slug + '-' + d,
          mealType: e.source === 'meal' ? 'Meal' : 'Unspecified',
          timestamp: d,
          items, avgScore: e.score, note: e.userNote || ''
        });
      });
    });
  }catch(e){ /* nothing to migrate */ }
}
async function saveData(){
  if(!currentUid) return false;
  if(LOGS.length === 0 && lastKnownCount > 0){
    console.error('Refused to save: LOGS is empty but was previously non-empty.');
    return false;
  }
  try{
    const ref = doc(db, 'users', currentUid, 'foodlog', 'v2');
    await setDoc(ref, { payload: JSON.stringify({logs: LOGS, foodCache: FOODCACHE}), updatedAt: new Date().toISOString() });
    lastKnownCount = LOGS.length;
    return true;
  }catch(e){ return false; }
}
async function saveBodyData(){
  if(!currentUid) return false;
  try{
    const ref = doc(db, 'users', currentUid, 'bodylog', 'data');
    await setDoc(ref, { payload: JSON.stringify({fields: BODYFIELDS, entries: BODYLOGS, types: BODYTYPES}), updatedAt: new Date().toISOString() });
    return true;
  }catch(e){ return false; }
}

/* ---------- Ingredient autocomplete, so re-typed foods stay consistent ---------- */
function currentTypedSegment(){
  const parts = ingredientsInput.value.split(',');
  return parts[parts.length-1].trim();
}
function updateIngredientSuggestions(){
  const box = document.getElementById('ingredientSuggestions');
  const seg = currentTypedSegment().toLowerCase();
  if(seg.length < 2){ box.style.display='none'; box.innerHTML=''; return; }
  const matches = Object.values(FOODCACHE)
    .filter(f => f.name.toLowerCase() !== seg && f.name.toLowerCase().includes(seg))
    .sort((a,b)=> a.name.length - b.name.length)
    .slice(0,6);
  if(matches.length === 0){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display = 'block';
  box.innerHTML = matches.map(m=>
    `<button type="button" class="suggestion-row" data-suggest="${m.name.replace(/"/g,'&quot;')}">${m.name}</button>`
  ).join('');
  box.querySelectorAll('[data-suggest]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const parts = ingredientsInput.value.split(',');
      parts[parts.length-1] = (parts.length>1 ? ' ' : '') + btn.dataset.suggest;
      ingredientsInput.value = parts.join(',');
      box.style.display='none'; box.innerHTML='';
      ingredientsInput.focus();
    });
  });
}
ingredientsInput.addEventListener('input', updateIngredientSuggestions);
ingredientsInput.addEventListener('blur', ()=>{
  setTimeout(()=>{ document.getElementById('ingredientSuggestions').style.display='none'; }, 150);

function lookupIngredient(name){
  const slug = slugify(name);
  if(FOODCACHE[slug]) return { score: FOODCACHE[slug].score, category: FOODCACHE[slug].category, note: FOODCACHE[slug].note, resolved:true };

  const t = name.toLowerCase().trim();
  const cached = Object.values(FOODCACHE)
    .filter(f => t.length >= 3)
    .filter(f => {
      const fn = f.name.toLowerCase();
      return fn.includes(t) || t.includes(fn);
    })
    .sort((a,b)=> b.name.length - a.name.length)[0];
  if(cached) return { score: cached.score, category: cached.category, note: cached.note, resolved:true };

  const auto = lookupAuto(name);
  if(auto) return { score: auto.s, category: auto.c, note: auto.n, resolved:true };
  return { resolved:false };
}

document.getElementById('checkMealBtn').addEventListener('click', async ()=>{
  const raw = ingredientsInput.value.trim();
  if(!raw) return;
  if(!dataLoaded) await loadData();
  const names = raw.split(',').map(s=>capitalizeFirst(s.trim())).filter(Boolean);
  mealCheck = { mealType: selectedMealType, results: {}, queue: [] };
  names.forEach(name=>{
    const r = lookupIngredient(name);
    if(r.resolved){ mealCheck.results[name] = { score: r.score, category: r.category, note: r.note }; }
    else { mealCheck.queue.push(name); }
  });
  if(mealCheck.queue.length > 0){
    await resolveNextUnresolved();
  } else {
    renderMealSummaryForm();
  }
});

async function resolveNextUnresolved(){
  if(mealCheck.queue.length === 0){ renderMealSummaryForm(); return; }
  const name = mealCheck.queue[0];
  logResultArea.innerHTML = `<div class="card"><p class="hint">Looking up "${name}"…</p></div>`;
  const off = await lookupOpenFoodFacts(name);
  if(off) renderOffResolveStep(name, off);
  else renderManualResolveStep(name);
}

function renderOffResolveStep(name, off){
  const b = band(off.score);
  const label = off.brand ? `${off.productName} (${off.brand})` : off.productName;
  logResultArea.innerHTML = `
    <div class="card">
      <p class="hint">Closest match for <strong>${name}</strong>: ${label}${off.relevanceMatched ? '' : ' — <span style="color:var(--limit)">name doesn\'t clearly match, double check</span>'}</p>
      <div style="display:flex; align-items:center; gap:12px; margin-top:8px;">
        ${badgeHTML(off.score,'lg')}
        <div class="hint">${off.carbs}g carbs (${off.fiber}g fiber), ${off.sugar}g sugar, ${off.protein}g protein per 100g</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="acceptOffBtn">This is right</button>
        <button class="btn btn-secondary" id="rejectOffBtn">Not it</button>
      </div>
    </div>
  `;
  document.getElementById('acceptOffBtn').addEventListener('click', ()=>{
    mealCheck.results[name] = { score: off.score, category: 'Packaged product', note: `Estimated from label: ${off.carbs}g carbs (${off.fiber}g fiber), ${off.sugar}g sugar, ${off.protein}g protein per 100g.` };
    mealCheck.queue.shift();
    resolveNextUnresolved();
  });
  document.getElementById('rejectOffBtn').addEventListener('click', ()=> renderManualResolveStep(name));
}

function renderManualResolveStep(name){
  logResultArea.innerHTML = `
    <div class="card">
      <p class="hint">Not found — rate <strong>${name}</strong> yourself. It'll be recognized instantly next time.</p>
      <div class="btn-row wrap" id="bandButtons" style="flex-wrap:wrap;">
        ${BANDS.map(b=>`<button type="button" class="btn btn-secondary band-btn" data-score="${b.repScore}" style="flex:1 1 30%; color:${b.color}; background:#F7F7F9;">${b.label}</button>`).join('')}
      </div>
      <input type="text" id="catInput" placeholder="Category (optional)" style="margin-top:10px;">
      <div class="btn-row">
        <button class="btn btn-primary" id="saveManualBtn" disabled>Pick a rating first</button>
      </div>
    </div>
  `;
  let chosen = null;
  const buttons = logResultArea.querySelectorAll('.band-btn');
  const saveBtn = document.getElementById('saveManualBtn');
  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      buttons.forEach(b=> b.style.outline = 'none');
      btn.style.outline = `2px solid ${btn.style.color}`;
      chosen = parseFloat(btn.dataset.score);
      saveBtn.disabled = false; saveBtn.textContent = 'Save and continue';
    });
  });
  saveBtn.addEventListener('click', ()=>{
    if(chosen===null) return;
    const cat = document.getElementById('catInput').value.trim() || 'Uncategorized';
    mealCheck.results[name] = { score: chosen, category: cat, note: '' };
    mealCheck.queue.shift();
    resolveNextUnresolved();
  });
}

function renderMealSummaryForm(){
  const items = Object.entries(mealCheck.results).map(([name,r])=>({name, score:r.score, category:r.category, note:r.note}));
  const avg = Math.round((items.reduce((s,r)=>s+r.score,0)/items.length)*10)/10;
  const b = band(avg);
  const sorted = [...items].sort((a,b2)=>a.score-b2.score);
  const chips = sorted.map(i=>{
    const ib = band(i.score);
    return `<span class="chip"><span class="dot" style="background:${ib.color}">${i.score}</span>${i.name}</span>`;
  }).join('');
  logResultArea.innerHTML = `
    <div class="card">
      <div style="display:flex; align-items:center; gap:12px;">
        ${badgeHTML(avg,'lg')}
        <div>
          <div class="entry-name">${mealCheck.mealType}</div>
          <div class="entry-meta" style="color:${b.color}; font-weight:600;">${b.label}</div>
        </div>
      </div>
      <div style="margin-top:10px;">${chips}</div>
      <label class="field-label" style="margin-top:14px;">Note (optional)</label>
      <textarea id="mealNoteInput" placeholder="Anything worth remembering about this one"></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" id="saveMealBtn">Save to journal</button>
      </div>
    </div>
  `;
  document.getElementById('saveMealBtn').addEventListener('click', async ()=>{
    const note = document.getElementById('mealNoteInput').value.trim();
    const now = new Date().toISOString();
    const entry = {
      id: 'log-' + now + '-' + Math.random().toString(36).slice(2,7),
      mealType: mealCheck.mealType,
      timestamp: now,
      items: items.map(i=>({name:i.name, score:i.score})),
      avgScore: avg,
      note
    };
    LOGS.push(entry);
    items.forEach(i=>{
      FOODCACHE[slugify(i.name)] = { name: i.name, score: i.score, category: i.category, note: i.note };
    });
    await saveData();
    logResultArea.innerHTML = `<div class="card"><p class="hint">Saved — ${mealCheck.mealType} rated ${avg}/10.</p></div>`;
    ingredientsInput.value = '';
    mealCheck = null;
  });
}

function renderEntryEditor(box, id, entry, localVal){
  const rowsHTML = entry.items.map((it,idx)=>`
    <div style="display:flex; align-items:center; gap:8px; margin-top:6px;" data-row="${idx}">
      <input type="text" value="${it.name}" id="nameEdit-${id}-${idx}" style="flex:1;">
      <input type="number" min="1" max="10" step="0.5" value="${it.score}" id="scoreEdit-${id}-${idx}" style="width:70px;">
      <button type="button" data-removerow="${idx}" style="background:none; border:none; color:var(--danger); font-size:18px; padding:0 4px; cursor:pointer;">×</button>
    </div>
  `).join('');
  box.innerHTML = `
    <label class="field-label" style="margin-top:10px;">Time</label>
    <input type="datetime-local" id="timeInput-${id}" value="${localVal}">
    <span class="hint">Pacific time</span>
    <label class="field-label" style="margin-top:10px;">Items</label>
    <div id="itemRows-${id}">${rowsHTML}</div>
    <button type="button" class="btn-text" id="addRowBtn-${id}" style="margin-top:6px;">+ Add item</button>
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn btn-primary" data-saveentry="${id}">Save</button>
    </div>
  `;
  box.querySelector(`#addRowBtn-${id}`).addEventListener('click', ()=>{
    const container = box.querySelector(`#itemRows-${id}`);
    const idx = container.children.length;
    const div = document.createElement('div');
    div.style.cssText = 'display:flex; align-items:center; gap:8px; margin-top:6px;';
    div.dataset.row = idx;
    div.innerHTML = `
      <input type="text" placeholder="New item" id="nameEdit-${id}-${idx}" style="flex:1;">
      <input type="number" min="1" max="10" step="0.5" placeholder="Score" id="scoreEdit-${id}-${idx}" style="width:70px;">
      <button type="button" data-removerow="${idx}" style="background:none; border:none; color:var(--danger); font-size:18px; padding:0 4px; cursor:pointer;">×</button>
    `;
    container.appendChild(div);
    div.querySelector('[data-removerow]').addEventListener('click', ()=> div.remove());
  });
  box.querySelectorAll('[data-removerow]').forEach(x=>{
    x.addEventListener('click', (e)=> e.target.closest('[data-row]').remove());
  });
  box.querySelector(`[data-saveentry]`).addEventListener('click', async ()=>{
    const timeVal = document.getElementById(`timeInput-${id}`).value;
    const rows = box.querySelectorAll(`#itemRows-${id} [data-row]`);
    const newItems = [];
    rows.forEach(row=>{
      const idx = row.dataset.row;
      const nameEl = document.getElementById(`nameEdit-${id}-${idx}`);
      const scoreEl = document.getElementById(`scoreEdit-${id}-${idx}`);
      if(!nameEl || !scoreEl) return;
      const name = capitalizeFirst(nameEl.value.trim());
      const score = parseFloat(scoreEl.value);
      if(name && !isNaN(score)){
        newItems.push({name, score});
        FOODCACHE[slugify(name)] = { ...(FOODCACHE[slugify(name)]||{}), name, score };
      }
    });
    if(newItems.length === 0) return; // refuse to save a meal with nothing in it
    entry.items = newItems;
    entry.avgScore = Math.round((newItems.reduce((s,i)=>s+i.score,0)/newItems.length)*10)/10;
    if(timeVal) entry.timestamp = pacificWallTimeToISO(timeVal);
    await saveData();
    updateJournalList();
  });
}

function updateJournalList(){
  const searchTerm = (document.getElementById('journalSearch')?.value || '').trim().toLowerCase();
  const totalMeals = LOGS.length;
  const weightedAvg = Math.round((LOGS.reduce((s,e)=>s+e.avgScore,0)/totalMeals)*10)/10;
  const troubleCount = LOGS.filter(e=> e.items.some(i=>i.score<=4)).length;
  document.getElementById('journalStats').innerHTML = `
    <div class="stats-row">
      <div class="stat"><div class="n">${totalMeals}</div><div class="l">meals logged</div></div>
      <div class="stat"><div class="n">${weightedAvg}</div><div class="l">avg score</div></div>
      <div class="stat"><div class="n">${troubleCount}</div><div class="l">had a weak spot</div></div>
    </div>
  `;
  let entries = [...LOGS];
  if(searchTerm){
    entries = entries.filter(e=> e.mealType.toLowerCase().includes(searchTerm) || e.items.some(i=>i.name.toLowerCase().includes(searchTerm)));
  }
  if(journalFilter==='trouble'){
    entries = entries.filter(e=> e.items.some(i=>i.score<=4));
  }
  entries.sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp));

  const list = document.getElementById('journalList');
  if(entries.length===0){
    list.innerHTML = `<li><span class="empty">Nothing in this view.</span></li>`;
    return;
  }
  list.innerHTML = '';
  entries.forEach(e=>{
    const b = band(e.avgScore);
    const sorted = [...e.items].sort((a,c)=>a.score-c.score);
    const chips = sorted.map(i=>{
      const ib = band(i.score);
      return `<span class="chip"><span class="dot" style="background:${ib.color}">${i.score}</span>${i.name}</span>`;
    }).join('');
    const li = document.createElement('li');
    li.innerHTML = `
      ${badgeHTML(e.avgScore)}
      <div style="flex:1;">
        <span class="meal-tag">${e.mealType}</span>
        <div class="entry-meta">${fmtDate(e.timestamp)} · ${fmtTime(e.timestamp)}</div>
        <div style="margin-top:6px;">${chips}</div>
        ${e.note ? `<div class="note-text">${e.note}</div>` : ''}
        <div class="entry-actions">
          <button data-duplicate="${e.id}">Duplicate</button>
          <button data-editentry="${e.id}">Edit</button>
          <button data-remove="${e.id}" class="danger">Delete</button>
        </div>
        <div id="editorFor-${e.id}"></div>
      </div>
    `;
    list.appendChild(li);
  });

  list.querySelectorAll('[data-duplicate]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.duplicate;
      const entry = LOGS.find(l=>l.id===id);
      selectedMealType = entry.mealType;
      document.querySelectorAll('#mealTypeSegment button').forEach(b=>{
        b.classList.toggle('active', b.dataset.meal === entry.mealType);
      });
      ingredientsInput.value = entry.items.map(i=>i.name).join(', ');
      switchTab('Log');
      ingredientsInput.focus();
    });
  });
  list.querySelectorAll('[data-editentry]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.editentry;
      const entry = LOGS.find(l=>l.id===id);
      const box = document.getElementById(`editorFor-${id}`);
      const localVal = isoToPacificWallTimeLocal(entry.timestamp);
      renderEntryEditor(box, id, entry, localVal);
    });
  });
  list.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.remove;
      const entry = LOGS.find(l=>l.id===id);
      if(!confirm(`Remove this ${entry.mealType} entry from ${fmtDate(entry.timestamp)}? This can't be undone.`)) return;
      LOGS = LOGS.filter(l=>l.id!==id);
      await saveData();
      updateJournalList();
    });
  });
}
function csvEscape(val){
  const s = String(val ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function downloadJournalCSV(){
  const rows = [['Date','Time','Meal','Item','Score','Band','Meal Avg','Note']];
  LOGS.forEach(e=>{
    e.items.forEach(i=>{
      rows.push([fmtDate(e.timestamp), fmtTime(e.timestamp), e.mealType, i.name, i.score, band(i.score).label, e.avgScore, e.note||'']);
    });
  });
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ledger-journal-${todayInputValue()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- Body log ---------- */
function capitalizeFirst(str){
  if(!str) return str;
  return str.charAt(0).toUpperCase() + str.slice(1);
}
function titleCase(str){
  if(!str) return str;
  return str.split(' ').map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : w).join(' ');
}
function formatDurationDisplay(totalSeconds){
  if(totalSeconds===null || totalSeconds===undefined || isNaN(totalSeconds)) return '';
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = Math.floor(totalSeconds%60);
  const pad = n => String(n).padStart(2,'0');
  return h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function formatDurationCSV(totalSeconds){
  if(totalSeconds===null || totalSeconds===undefined || isNaN(totalSeconds)) return '';
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = Math.floor(totalSeconds%60);
  const pad = n => String(n).padStart(2,'0');
  return `'${h}:${pad(m)}:${pad(s)}`; // leading apostrophe stops Excel auto-converting this to a clock time
}
let selectedBodyFields = [];
let editingBodyId = null;

function renderFieldPicker(){
  const box = document.getElementById('fieldPicker');
  if(BODYFIELDS.length===0){ box.innerHTML = `<p class="hint">No fields yet — add one below.</p>`; return; }
  box.innerHTML = BODYFIELDS.map(f=>{
    const checked = selectedBodyFields.includes(f) ? 'checked' : '';
    return `
      <label style="display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14.5px;">
        <input type="checkbox" data-fieldcheck="${f}" ${checked}>
        ${f}
        <button type="button" data-removefield="${f}" style="margin-left:auto; background:none; border:none; color:var(--text-secondary); font-size:16px; cursor:pointer;">×</button>
      </label>
    `;
  }).join('');
  box.querySelectorAll('[data-fieldcheck]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const f = cb.dataset.fieldcheck;
      if(cb.checked){ if(!selectedBodyFields.includes(f)) selectedBodyFields.push(f); }
      else { selectedBodyFields = selectedBodyFields.filter(x=>x!==f); }
      renderBodyFieldInputs();
      openBodyForm();
    });
  });
  box.querySelectorAll('[data-removefield]').forEach(btn=>{
    btn.addEventListener('click', async (ev)=>{
      ev.preventDefault();
      const f = btn.dataset.removefield;
      if(!confirm(`Remove the "${f}" field? Past entries keep their value, but you won't be able to pick it for new ones.`)) return;
      BODYFIELDS = BODYFIELDS.filter(x=>x!==f);
      selectedBodyFields = selectedBodyFields.filter(x=>x!==f);
      await saveBodyData();
      renderFieldPicker();
      renderBodyFieldInputs();
    });
  });
}
function renderBodyFieldInputs(){
  const box = document.getElementById('bodyFieldInputs');
  const existingValues = {};
  box.querySelectorAll('input[data-fieldvalue]').forEach(inp=>{ existingValues[inp.dataset.fieldvalue] = inp.value; });
  box.innerHTML = selectedBodyFields.map(f=>`
    <label class="field-label" style="margin-top:8px;">${f}</label>
    <input type="text" data-fieldvalue="${f}" value="${existingValues[f] || ''}" placeholder="Value">
  `).join('');
}
document.getElementById('addFieldBtn').addEventListener('click', async ()=>{
  const input = document.getElementById('newFieldInput');
  const name = capitalizeFirst(input.value.trim());
  if(!name || BODYFIELDS.includes(name)) return;
  BODYFIELDS.push(name);
  selectedBodyFields.push(name);
  await saveBodyData();
  input.value = '';
  renderFieldPicker();
  renderBodyFieldInputs();
  openBodyForm();
});
document.getElementById('cancelEditBodyBtn').addEventListener('click', ()=>{ resetBodyForm(); closeBodyForm(); });
document.getElementById('openBlankFormBtn').addEventListener('click', ()=> openBodyForm());

function openBodyForm(){
  document.getElementById('bodyFormCard').style.display = 'block';
  document.getElementById('bodyFormCard').scrollIntoView({behavior:'smooth', block:'center'});
}
function closeBodyForm(){
  document.getElementById('bodyFormCard').style.display = 'none';
}

let selectedBodyType = '';
function renderTypeChipPicker(){
  const box = document.getElementById('typeChipPicker');
  if(BODYTYPES.length===0){ box.innerHTML = `<p class="hint">No types yet — add one below.</p>`; return; }
  box.innerHTML = BODYTYPES.map(t=>
    `<button type="button" class="type-chip${t===selectedBodyType?' selected':''}" data-typechip="${t}">${t}</button>`
  ).join('');
  box.querySelectorAll('[data-typechip]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedBodyType = (selectedBodyType === btn.dataset.typechip) ? '' : btn.dataset.typechip;
      renderTypeChipPicker();
      openBodyForm();
    });
  });
}
document.getElementById('addTypeBtn').addEventListener('click', async ()=>{
  const input = document.getElementById('newTypeInput');
  const name = titleCase(input.value.trim());
  if(!name || BODYTYPES.includes(name)) return;
  BODYTYPES.push(name);
  selectedBodyType = name;
  await saveBodyData();
  input.value = '';
  renderTypeChipPicker();
  openBodyForm();
});
function resetBodyForm(){
  editingBodyId = null;
  selectedBodyFields = [];
  document.getElementById('editingBanner').style.display = 'none';
  document.getElementById('bodyDateInput').value = todayInputValue();
  document.getElementById('bodyTypeInput').value = '';
  document.getElementById('bodyDetailInput').value = '';
  document.getElementById('bodyNotesInput').value = '';
  document.getElementById('bodyMinInput').value = '';
  document.getElementById('bodySecInput').value = '';
  renderFieldPicker();
  renderBodyFieldInputs();
}
function loadBodyEntryIntoForm(id){
  const e = BODYLOGS.find(x=>x.id===id);
  if(!e) return;
  editingBodyId = id;
  document.getElementById('editingBanner').style.display = 'block';
  document.getElementById('bodyDateInput').value = e.date;
  selectedBodyType = e.type || '';
  if(selectedBodyType && !BODYTYPES.includes(selectedBodyType)) BODYTYPES.push(selectedBodyType);
  renderTypeChipPicker();
  document.getElementById('bodyDetailInput').value = e.detail || e.workout || '';
  document.getElementById('bodyNotesInput').value = e.notes || '';
  if(e.timeSeconds !== undefined && e.timeSeconds !== null){
    document.getElementById('bodyMinInput').value = Math.floor(e.timeSeconds/60);
    document.getElementById('bodySecInput').value = e.timeSeconds%60;
  } else {
    document.getElementById('bodyMinInput').value = '';
    document.getElementById('bodySecInput').value = '';
  }
  selectedBodyFields = Object.keys(e.values || {});
  renderFieldPicker();
  renderBodyFieldInputs();
  document.querySelectorAll('#panelBody input[data-fieldvalue]').forEach(inp=>{
    inp.value = e.values[inp.dataset.fieldvalue] || '';
  });
  switchTab('Body');
  openBodyForm();
}
document.getElementById('saveBodyBtn').addEventListener('click', async ()=>{
  const date = document.getElementById('bodyDateInput').value;
  if(!date) return;
  const type = titleCase(document.getElementById('bodyTypeInput').value.trim());
  const detail = titleCase(document.getElementById('bodyDetailInput').value.trim());
  const notes = titleCase(document.getElementById('bodyNotesInput').value.trim());
  const min = parseInt(document.getElementById('bodyMinInput').value, 10);
  const sec = parseInt(document.getElementById('bodySecInput').value, 10);
  const timeSeconds = (isNaN(min) && isNaN(sec)) ? null : (isNaN(min)?0:min)*60 + (isNaN(sec)?0:sec);
  const values = {};
  document.querySelectorAll('#panelBody input[data-fieldvalue]').forEach(inp=>{
    const v = inp.value.trim();
    if(v) values[inp.dataset.fieldvalue] = titleCase(v);
  });
  if(Object.keys(values).length===0 && !type && !detail && timeSeconds===null) return;

  if(editingBodyId){
    const e = BODYLOGS.find(x=>x.id===editingBodyId);
    Object.assign(e, { date, type, detail, notes, timeSeconds, values });
    delete e.workout; delete e.time;
  } else {
    BODYLOGS.push({ id: 'body-' + Date.now(), date, type, detail, notes, timeSeconds, values });
  }
  await saveBodyData();
  resetBodyForm();
  closeBodyForm();
  renderBodyEntries();
  populateTypeOptions();
});
function renderBodyEntries(){
  const area = document.getElementById('bodyEntriesArea');
  if(BODYLOGS.length===0){ area.innerHTML = `<p class="empty">No body log entries yet.</p>`; return; }
  const sorted = [...BODYLOGS].sort((a,b)=> new Date(b.date) - new Date(a.date));
  const rows = sorted.map(e=>{
    const metaBits = [fmtDate(dateInputToISO(e.date))];
    if(e.type) metaBits.push(e.type);
    const timeStr = (e.timeSeconds!==undefined && e.timeSeconds!==null) ? formatDurationDisplay(e.timeSeconds) : (e.time || '');
    if(timeStr) metaBits.push(timeStr);
    const detailText = e.detail || e.workout || '';
    const fieldChips = Object.entries(e.values||{}).map(([k,v])=>`<span class="chip">${k}: ${v}</span>`).join('');
    return `
      <li>
        <div style="flex:1;">
          <div class="entry-meta" style="font-weight:600; color:var(--text);">${metaBits.join(' · ')}</div>
          ${detailText ? `<div class="note-text">${detailText}</div>` : ''}
          ${e.notes ? `<div class="note-text" style="color:var(--text-secondary);">${e.notes}</div>` : ''}
          ${fieldChips ? `<div style="margin-top:4px;">${fieldChips}</div>` : ''}
          <div class="entry-actions">
            <button data-editbody="${e.id}">Edit</button>
            <button data-removebody="${e.id}" class="danger">Delete</button>
          </div>
        </div>
      </li>
    `;
  }).join('');
  area.innerHTML = `
    <div class="btn-row" style="margin-bottom:10px;">
      <button class="btn btn-secondary" id="bodyCsvBtn">Export CSV</button>
    </div>
    <ul class="row-list" style="list-style:none; padding:0;">${rows}</ul>
  `;
  document.getElementById('bodyCsvBtn').addEventListener('click', downloadBodyCSV);
  area.querySelectorAll('[data-editbody]').forEach(btn=>{
    btn.addEventListener('click', ()=> loadBodyEntryIntoForm(btn.dataset.editbody));
  });
  area.querySelectorAll('[data-removebody]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.removebody;
      if(!confirm('Delete this body log entry?')) return;
      BODYLOGS = BODYLOGS.filter(b=>b.id!==id);
      await saveBodyData();
      renderBodyEntries();
    });
  });
}
function downloadBodyCSV(){
  const rows = [['Date','Type','Detail','notes','time', ...BODYFIELDS]];
  [...BODYLOGS].sort((a,b)=> new Date(a.date)-new Date(b.date)).forEach(e=>{
    const timeVal = (e.timeSeconds!==undefined && e.timeSeconds!==null) ? formatDurationCSV(e.timeSeconds) : (e.time || '');
    rows.push([e.date, e.type||'', (e.detail||e.workout||''), e.notes||'', timeVal, ...BODYFIELDS.map(f=> (e.values||{})[f] ?? '')]);
  });
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ledger-body-${todayInputValue()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function renderBody(){
  if(!dataLoaded) await loadData();
  if(!editingBodyId){
    document.getElementById('bodyDateInput').value = todayInputValue();
    closeBodyForm();
  }
  renderFieldPicker();
  renderBodyFieldInputs();
  populateTypeOptions();
  renderBodyEntries();
}

/* ---------- Auth ---------- */
const authScreen = document.getElementById('authScreen');
const appShell = document.getElementById('appShell');
const authError = document.getElementById('authError');
const whoAmI = document.getElementById('whoAmI');

function friendlyAuthError(code){
  const map = {
    'auth/invalid-email': "That email doesn't look right.",
    'auth/user-not-found': "No account with that email — try Create one.",
    'auth/wrong-password': "Wrong password.",
    'auth/invalid-credential': "Email or password is wrong.",
    'auth/email-already-in-use': "An account already exists for that email — try Sign in instead.",
    'auth/weak-password': "Password needs to be at least 6 characters.",
  };
  return map[code] || ("Something went wrong (" + code + ").");
}
document.getElementById('signInBtn').addEventListener('click', async ()=>{
  authError.textContent = '';
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPassword').value;
  if(!email || !pass){ authError.textContent = 'Enter both email and password.'; return; }
  try{ await signInWithEmailAndPassword(auth, email, pass); }
  catch(e){ authError.textContent = friendlyAuthError(e.code); }
});
document.getElementById('createAcctBtn').addEventListener('click', async ()=>{
  authError.textContent = '';
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPassword').value;
  if(!email || !pass){ authError.textContent = 'Enter both email and password.'; return; }
  try{ await createUserWithEmailAndPassword(auth, email, pass); }
  catch(e){ authError.textContent = friendlyAuthError(e.code); }
});
document.getElementById('signOutBtn').addEventListener('click', ()=> signOut(auth));

onAuthStateChanged(auth, async (user)=>{
  if(user){
    currentUid = user.uid;
    whoAmI.textContent = user.email || user.uid;
    authScreen.style.display = 'none';
    appShell.style.display = 'block';
    await loadData();
    switchTab('Log');
  } else {
    currentUid = null; dataLoaded = false;
    authScreen.style.display = 'block';
    appShell.style.display = 'none';
  }
});
